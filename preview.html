<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>坐的设计 | DESIGN OF SITTING</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        background: #f0ebe4;
        color: #0a0a0a;
        font-family: "Noto Sans SC", system-ui, sans-serif;
      }
      @keyframes orbit-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes chair-upright {
        from {
          transform: rotate(calc(-1 * var(--slot, 0deg)));
        }
        to {
          transform: rotate(calc(-1 * var(--slot, 0deg) - 360deg));
        }
      }
      .orbit-spin {
        animation: orbit-spin 120s linear infinite;
        transform-origin: center center;
      }
      .chair-upright {
        animation: chair-upright 120s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit-spin,
        .chair-upright {
          animation: none !important;
        }
      }
      .ring-wrap {
        pointer-events: none;
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(92vmin, 720px);
        height: min(92vmin, 720px);
        transform: translate(-50%, -50%);
      }
      .orbit-spin {
        position: absolute;
        inset: 0;
        transform-origin: center center;
        scale: 1.14 1;
      }
      .slot {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
      }
      .slot-inner {
        transform: translate(-50%, -50%);
      }
      .chair-svg {
        width: 44px;
        height: 56px;
      }
      @media (min-width: 768px) {
        .chair-svg {
          width: 52px;
          height: 64px;
        }
      }
      .chair-svg path,
      .chair-svg ellipse {
        fill: none;
        stroke: #1a1a1a;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      header {
        position: absolute;
        right: 0;
        top: 0;
        z-index: 20;
        display: flex;
        justify-content: flex-end;
        width: 100%;
        padding: 2rem 1.5rem 0;
      }
      @media (min-width: 768px) {
        header {
          padding: 3rem 3rem 0;
        }
      }
      .lang {
        display: flex;
        gap: 0.25rem;
        font-size: 0.875rem;
        align-items: center;
      }
      .lang button {
        background: none;
        border: none;
        font: inherit;
        cursor: pointer;
        color: #737373;
      }
      .lang button.on {
        color: #0a0a0a;
        font-weight: 600;
      }
      .lang .sep {
        color: #a3a3a3;
      }
      main {
        position: relative;
        display: flex;
        min-height: 100svh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 4rem 1.5rem 3rem;
      }
      .center {
        position: relative;
        z-index: 10;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.75rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .sub {
        margin-top: 1rem;
        font-family: "DM Sans", sans-serif;
        font-size: clamp(0.6rem, 2vw, 0.75rem);
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.32em;
        color: #262626;
      }
      .cta {
        margin-top: 3.5rem;
        padding: 0.9rem 2.5rem;
        font-family: "DM Sans", sans-serif;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        border: none;
        background: #0a0a0a;
        color: #fff;
        cursor: pointer;
      }
      .cta:hover {
        background: #262626;
      }
      .note {
        margin-top: 2rem;
        font-size: 0.75rem;
        color: #737373;
        max-width: 20rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="lang" aria-label="Language">
        <button type="button" class="on" id="zhBtn">中文</button>
        <span class="sep">|</span>
        <button type="button" id="enBtn">EN</button>
      </nav>
    </header>
    <main>
      <div class="ring-wrap" id="ring" aria-hidden="true"></div>
      <div class="center">
        <h1 id="line1">坐的设计</h1>
        <p class="sub" id="line2">DESIGN OF SITTING</p>
        <button type="button" class="cta" id="cta">START</button>
        <p class="note" id="note">
          此为静态预览页。完整问卷与路由请在本机运行
          <code style="font-size: 0.7rem">npm install && npm run dev</code>
          后访问 Next 应用。
        </p>
      </div>
    </main>
    <script>
      const COUNT = 12;
      const tilts = [-8, 12, -18, 22, -14, 6, -20, 15, -10, 8, -16, 11];
      const paths = [
        "M14 58 L58 58 M20 58 L16 78 M52 58 L56 78 M24 22 Q36 8 48 22 L50 58 L22 58 L24 22",
        "M36 20 L36 72 M18 36 L54 36 M18 36 Q16 52 20 68 M54 36 Q56 52 52 68 M28 72 L44 72",
        "M36 72 L36 40 M28 40 L44 40 M32 28 L40 28 M22 40 Q36 18 50 40",
        "M12 24 L60 24 M12 24 L8 68 M60 24 L64 68 M16 40 L56 40 M20 56 L52 56",
        "M20 52 Q36 44 52 52 L50 70 L22 70 Z M36 52 L36 24 M28 24 L44 24",
        "M14 62 L58 62 M18 62 L14 78 M54 62 L58 78 M20 30 L52 30 L48 62 L24 62 Z",
        "M36 18 L36 74 M18 32 L54 32 M22 50 L50 50 M26 68 L46 68",
        "M20 70 L52 70 M36 70 L36 38 M24 38 Q36 22 48 38 M16 42 L56 42",
        "M14 26 L58 26 M14 26 L10 70 M58 26 L62 70 M18 42 L54 42 M22 58 L50 58",
        "M36 76 L36 48 M20 48 Q36 20 52 48 M24 32 L48 32",
        "M18 68 L54 68 M36 68 L36 36 M22 36 L50 36 M26 24 L46 24",
        "M16 60 L56 60 M20 60 L18 78 M52 60 L54 78 M24 34 L48 34 L46 60 L26 60 Z",
      ];

      const ring = document.getElementById("ring");
      const orbit = document.createElement("div");
      orbit.className = "orbit-spin";
      ring.appendChild(orbit);

      for (let i = 0; i < COUNT; i++) {
        const slotDeg = (360 / COUNT) * i;
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.style.transform = "rotate(" + slotDeg + "deg) translateY(-42vmin)";

        const inner = document.createElement("div");
        inner.className = "slot-inner";

        const upright = document.createElement("div");
        upright.className = "chair-upright";
        upright.style.setProperty("--slot", slotDeg + "deg");

        const tiltWrap = document.createElement("div");
        tiltWrap.style.transform = "rotate(" + tilts[i] + "deg)";
        tiltWrap.style.opacity = "0.9";

        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 72 88");
        svg.setAttribute("class", "chair-svg");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", paths[i]);
        svg.appendChild(path);
        if (i === 2) {
          const el = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
          el.setAttribute("cx", "36");
          el.setAttribute("cy", "72");
          el.setAttribute("rx", "18");
          el.setAttribute("ry", "6");
          svg.appendChild(el);
        }
        if (i === 9) {
          const el = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
          el.setAttribute("cx", "36");
          el.setAttribute("cy", "76");
          el.setAttribute("rx", "20");
          el.setAttribute("ry", "5");
          svg.appendChild(el);
        }
        tiltWrap.appendChild(svg);
        upright.appendChild(tiltWrap);
        inner.appendChild(upright);
        slot.appendChild(inner);
        orbit.appendChild(slot);
      }

      const zhBtn = document.getElementById("zhBtn");
      const enBtn = document.getElementById("enBtn");
      const line1 = document.getElementById("line1");
      const note = document.getElementById("note");
      zhBtn.addEventListener("click", () => {
        zhBtn.classList.add("on");
        enBtn.classList.remove("on");
        line1.textContent = "坐的设计";
        note.style.display = "";
      });
      enBtn.addEventListener("click", () => {
        enBtn.classList.add("on");
        zhBtn.classList.remove("on");
        line1.textContent = "坐的设计";
        note.textContent =
          "Static preview. Run npm install && npm run dev for the full Next.js app with questionnaire.";
        note.style.display = "block";
      });
    </script>
  </body>
</html>
